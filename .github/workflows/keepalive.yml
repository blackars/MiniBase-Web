# Keepalive Supabase Free — evita la pausa por inactividad.
# Corre a diario (cron UTC) + boton manual. Hace 3 queries baratas.
# Supabase recomienda "unos pocos requests al dia" durante la semana previa:
# https://supabase.com/docs/guides/platform/project-pausing
# Requiere secrets: SUPABASE_URL, SUPABASE_SECRET_KEY
# (Settings > Secrets > Actions). Usa SECRET (service_role), nunca ANON en backup,
# pero aqui solo lee collections/miniatures + upsert heartbeat: sin datos sensibles.
name: keepalive-supabase

on:
  schedule:
    - cron: "17 8 * * *"   # a diario, 08:17 UTC (evita hora en punto)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install supabase>=2.5
      - run: python api/scripts/keepalive.py --verbose
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
